name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      # Lint has pre-existing debt. Reported, not blocking, until it is clean.
      - run: npm run lint:check
        continue-on-error: true
      # Most existing specs fail on missing test providers (pre-existing). Reported, not
      # blocking, until they are repaired; app.controller.spec.ts is the model to follow.
      - run: npm test -- --ci
        continue-on-error: true
      - run: npm run build

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
